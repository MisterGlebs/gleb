[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gleb"
version = "0.1.0"
description = "Godot Level Export Blender-tool — CLI for Blender 5+ blend files and Godot-oriented export"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer[all]",
  "pydantic>=2",
  "rich",
]

[project.optional-dependencies]
textures = [
  "numpy>=1.26",
  "pillow>=10",
]

[project.scripts]
gleb = "gleb.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["gleb*"]
